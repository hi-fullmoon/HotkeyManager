ing{border-color:#326be8;background:#eaf1ff;color:#326be8}.help{font-size:11px;color:#949cab;line-height:1.7;margin-bottom:21px}.behavior{padding:13px;background:#f7f9fc;border-radius:7px;font-size:11px;line-height:1.9;color:#8390a3}.behavior b{display:block;color:#56637a;font-size:12px}.advanced{margin:18px 0;color:#68758b;font-size:12px}.advanced summary{cursor:pointer}.advanced input{margin-top:10px}.actions{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf0f4;margin-top:17px;padding-top:17px}.delete{border:0;color:#bd6570;background:none;padding-left:0}.footer{margin-top:24px;display:flex;justify-content:space-between;font-size:11px;color:#929baa}.hint{padding:15px 7px;font-size:11px;color:#949dab;line-height:1.9}.error{font-size:12px;color:#cf4f54;margin-bottom:12px;min-height:18px}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#26354a;color:white;padding:12px 22px;border-radius:8px;box-shadow:0 8px 30px #0002;display:none} @media(max-width:1000px){.app{margin:15px}.layout{grid-template-columns:150px 1fr}main{padding:24px}.workspace{grid-template-columns:1fr}.overview .tip{display:none}}@media(max-width:600px){nav{display:none}.layout{display:block}main{padding:18px}.heading{gap:8px}h1{font-size:23px}.overview{gap:15px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.footer{gap:15px}}
/* Compact desktop settings layout */
.app{max-width:880px;margin:28px auto;border-radius:10px;box-shadow:0 14px 50px #26354a12}

/* Refined compact spacing: 4 / 8 / 12 px */
main{padding:14px 16px}
.titlebar{height:34px;padding:0 12px;gap:8px}
.heading button{padding:6px 10px}

.search{padding:7px 9px}.filter{padding:6px 10px}
.workspace{gap:12px}
.listhead{padding:0 8px 6px}

.searchbar:focus-within{border-color:#91b2f5;box-shadow:0 0 0 2px #326be810;background:white}

<div class="app"><div class="titlebar"><span class="brand">⌘</span> Hotkey Manager <span class="preview">交互设计预览 · DEMO</span></div><div class="layout"><main><div class="heading"><div><h1>快捷键设置</h1></div></div><div class="toolbar"><div class="searchbar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input class="search" id="search" placeholder="搜索应用、进程或快捷键" aria-label="搜索应用、进程或快捷键"><span id="searchcount" aria-live="polite"></span></div></div><div class="workspace"><section><div class="listhead"><span class="listtitle">应用快捷键</span><button id="add" class="add-inline" aria-label="新建快捷键"><span aria-hidden="true">＋</span> 新建快捷键</button></div><div id="list"></div></section><section class="panel"><div class="panelheader"><span>⚙</span><strong>快捷键详情</strong><span class="tag">应用切换</span></div><div class="form"><label for="name">应用名称</label><input class="field" id="name"><label>快捷键</label><button id="record" aria-label="点击录制快捷键"></button><div class="help" id="recordhint">点击上方区域，然后按下想使用的组合键</div><div class="error" id="error" role="alert"></div><label for="path">应用路径</label><input class="field" id="path" placeholder="C:\\Program Files\\App\\app.exe"><label for="process">进程名称</label><input class="field" id="process" placeholder="不包含 .exe"><div class="actions"><button class="delete" id="delete">删除</button><button class="primary" id="save">保存更改</button></div></div></section></div><div class="footer"><span>ⓘ 演示数据保存在此浏览器，不会注册系统热键。</span><button id="reset" style="border:0;padding:0;font-size:11px;color:#8591a3">恢复演示数据</button></div></main></div></div><div id="toast" role="status"></div>
<script>
const defaults=[{name:'微信',process:'WeChat',path:'C:\\Program Files\\Tencent\\WeChat\\WeChat.exe',key:'Ctrl+Alt+1',icon:'微',bg:'#e5f6ec',fg:'#29a25b'},{name:'Visual Studio Code',process:'Code',path:'C:\\Program Files\\Microsoft VS Code\\Code.exe',key:'Ctrl+Alt+2',icon:'⌘',bg:'#e5f1fc',fg:'#2d90d4'},{name:'Google Chrome',process:'chrome',path:'C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe',key:'Ctrl+Alt+3',icon:'◉',bg:'#fff2df',fg:'#d39530'},{name:'文件资源管理器',process:'explorer',path:'C:\\Windows\\explorer.exe',key:'Ctrl+Alt+E',icon:'▣',bg:'#fff5d9',fg:'#c59d34'},{name:'记事本',process:'notepad',path:'C:\\Windows\\System32\\notepad.exe',key:'Ctrl+Alt+N',icon:'▤',bg:'#edf1f8',fg:'#7189aa'}];
const $=id=>document.getElementById(id);let items;try{items=JSON.parse(localStorage.getItem('hotkey-demo-v1'))}catch{}if(!Array.isArray(items)||!items.length)items=structuredClone(defaults);let selected=0,draft='',recording=false;
function keys(el,key){el.replaceChildren();if(!key){el.textContent='点击录制快捷键';return}key.split('+').forEach(k=>{let e=document.createElement('kbd');e.textContent=k;el.append(e)})}
function render(){ $('list').replaceChildren();let count=0;items.forEach((a,i)=>{if(!(a.name+' '+a.key+' '+a.process).toLowerCase().includes($('search').value.toLowerCase()))return;count++;let b=document.createElement('button');b.className='item'+(selected===i?' selected':'');let icon=document.createElement('span');icon.className='icon';icon.style.setProperty('--bg',a.bg);icon.style.setProperty('--fg',a.fg);icon.textContent=a.icon;let text=document.createElement('div'),n=document.createElement('div'),s=document.createElement('div');n.className='name';n.textContent=a.name;s.className='sub';s.textContent=a.process? a.process+'.exe':'等待配置应用';text.append(n,s);let k=document.createElement('span');k.className='keys';keys(k,a.key);if(!a.key)k.textContent='待设置';b.append(icon,text,k);b.onclick=()=>load(i);$('list').append(b)});$('searchcount').textContent=count+' 个应用';if(!count){let p=document.createElement('p');p.style.padding='30px 12px';p.textContent='没有匹配的快捷键';$('list').append(p)}}
function load(i){selected=i;recording=false;$('record').classList.remove('recording');const a=items[i];$('name').value=a.name;$('path').value=a.path;$('process').value=a.process;draft=a.key;keys($('record'),draft);$('error').textContent='';$('recordhint').textContent='点击上方区域，然后按下想使用的组合键';render()}
function persist(){try{localStorage.setItem('hotkey-demo-v1',JSON.stringify(items))}catch{toast('浏览器不支持存储，数据仅在当前页面保留')}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
$('record').onclick=()=>{recording=!recording;$('record').classList.toggle('recording',recording);if(recording){$('record').textContent='请按下组合键…';$('recordhint').textContent='按 Esc 取消录制';}else keys($('record'),draft)};
document.addEventListener('keydown',e=>{if(!recording)return;e.preventDefault();if(e.key==='Escape'){recording=false;keys($('record'),draft);$('record').classList.remove('recording');return}if(['Control','Alt','Shift','Meta'].includes(e.key))return;let key=e.code.startsWith('Key')?e.code.slice(3):e.code.startsWith('Digit')?e.code.slice(5):e.key===' '?'Space':e.key;if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.shiftKey&&!/^F\d+$/.test(key)){$('error').textContent='请至少搭配一个修饰键，例如 Ctrl 或 Alt。';return}draft=[e.ctrlKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Win':'',key].filter(Boolean).join('+');recording=false;$('record').classList.remove('recording');keys($('record'),draft);let other=items.find((a,i)=>i!==selected&&a.key===draft);$('error').textContent=other?'此组合键已用于「'+other.name+'」，请重新录制。':'';$('recordhint').textContent='已录制，保存后生效（仅演示）'});
$('save').onclick=()=>{if(!$('name').value.trim()||!$('path').value.trim()||!$('process').value.trim()||!draft){$('error').textContent='请填写应用名称、路径、进程名称，并录制快捷键。';return}if(items.some((a,i)=>i!==selected&&a.key===draft)){$('error').textContent='快捷键重复，请换一个组合。';return}Object.assign(items[selected],{name:$('name').value.trim(),path:$('path').value.trim(),process:$('process').value.trim().replace(/\.exe$/i,''),key:draft});persist();load(selected);toast('快捷键已保存到演示配置')};
$('add').onclick=()=>{items.push({name:'新应用',process:'',path:'',key:'',icon:'＋',bg:'#eff2f8',fg:'#8796b0'});$('search').value='';load(items.length-1);$('name').focus();$('name').select()};$('delete').onclick=()=>{if(items.length===1){toast('请至少保留一个演示条目');return}items.splice(selected,1);persist();load(Math.min(selected,items.length-1));toast('已删除快捷键')};$('search').oninput=render;$('reset').onclick=()=>{items=structuredClone(defaults);persist();$('search').value='';load(0);toast('已恢复演示数据')};load(0);
</script></html>
