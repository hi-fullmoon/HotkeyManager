<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotkey Manager · 快捷键设置</title>
<style>/* SETTINGS_STYLE */</style>
<div class="app"><div class="layout"><main><div class="heading"><div><h1>快捷键设置</h1></div></div><div class="toolbar"><div class="searchbar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input class="search" id="search" placeholder="搜索应用、进程或快捷键" aria-label="搜索应用、进程或快捷键"><span id="searchcount" aria-live="polite"></span></div></div><div class="workspace"><section><div class="listhead"><span class="listtitle">应用快捷键</span><button id="add" class="add-inline" aria-label="新建快捷键"><svg class="add-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建快捷键</span></button></div><div id="list"></div><div id="listpager" class="listpager" aria-label="应用列表分页"></div></section><section class="panel"><div class="panelheader"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><strong>快捷键详情</strong><span class="tag">应用切换</span></div><div class="form"><label for="name">应用名称</label><input class="field" id="name"><label>快捷键</label><button id="record" aria-label="点击录制快捷键"></button><div class="help" id="recordhint">点击上方区域，然后按下想使用的组合键</div><div class="error" id="error" role="alert"></div><div class="field-label"><label for="path">应用路径</label><button type="button" id="running" class="running-link">从运行中选择</button></div><div class="path-input"><button type="button" id="browse" aria-label="选择应用程序" title="选择应用程序"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3Z"/></svg></button><input class="field" id="path" placeholder="C:\Program Files\App\app.exe"></div><label for="process">进程名称</label><input class="field" id="process" placeholder="不包含 .exe"><div class="actions"><button class="delete" id="delete">删除</button><button class="primary" id="save">保存更改</button></div></div></section></div><div class="footer"><span>保存后立即生效 · 关闭窗口后继续在托盘运行</span><button id="reset" class="reload-button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg><span>重新加载配置</span></button></div></main></div></div><div id="toast" role="status"></div>
<dialog id="running-dialog" class="running-dialog" aria-labelledby="running-title">
<div class="running-heading"><h2 id="running-title">选择运行中的应用</h2><button type="button" id="running-close" class="icon-button" aria-label="关闭应用选择"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div class="searchbar running-searchbar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="running-search" class="search" placeholder="搜索应用、窗口或进程" aria-label="搜索运行中的应用"></div>
<div id="running-list" class="running-list" aria-label="运行中的应用列表"></div>
<div class="running-footer"><div id="running-status" class="running-status" role="status"></div><button type="button" id="running-refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg><span>刷新</span></button></div>
</dialog>
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
<div class="confirm-heading"><span class="confirm-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9"/></svg></span><h2 id="confirm-title"></h2></div>
<p id="confirm-description"></p><div class="confirm-actions"><button id="confirm-cancel" type="button" autofocus>取消</button><button id="confirm-accept" class="danger" type="button">确认</button></div>
</dialog><script>/* SETTINGS_SCRIPT */</script></html>
